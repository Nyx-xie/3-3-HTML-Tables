<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                
                <tr>
                    <td>Unicorn Rainbow Cake</td>
                    <td>Yummy Cake and Rainbow and Glitter</td>
                    <td>$2</td>
                </tr>
                <tr>
                    <td>Black and White Glitter Cake</td>
                    <td>Yummy Cake and Black and White and Glitter</td>
                    <td>$2</td>
                </tr>
                <tr>
                    <td>Neon Glitter Cake</td>
                    <td>Yummy Cake and Neon Colors and Glitter</td>
                    <td>$2</td>
                </tr>
                
            </tbody>
        </table>


    </body>
</html>
